version: 2

project_name: telecrawl

changelog:
  disable: false

release:
  draft: true
  name_template: "{{ .Tag }}"
  target_commitish: "{{ .Commit }}"

snapshot:
  version_template: '{{ if index .Env "TELECRAWL_PILOT_VERSION" }}{{ index .Env "TELECRAWL_PILOT_VERSION" }}{{ else }}{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}{{ end }}'

builds:
  - id: telecrawl
    main: ./cmd/telecrawl
    binary: telecrawl
    flags:
      - -trimpath
    env: &release_build_env
      - CGO_ENABLED=0
      - "GOCACHEPROG="
      - "GODEBUG="
      - GO111MODULE=on
      - GOAUTH=off
      - GOENV=off
      - "GOEXPERIMENT="
      - "GOFLAGS="
      - GOFIPS140=off
      - "GOINSECURE="
      - GOAMD64=v1
      - GOARM64=v8.0
      - "GONOPROXY="
      - "GONOSUMDB="
      - "GOPRIVATE="
      - GOPROXY=https://proxy.golang.org
      - "GOROOT="
      - GOSUMDB=sum.golang.org
      - GOTOOLCHAIN=local
      - GOWORK=off
    ldflags:
      - -s -w -X github.com/openclaw/telecrawl/internal/cli.version={{ .Version }}
    targets:
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: telecrawl_darwin
    main: ./cmd/telecrawl
    binary: telecrawl
    flags:
      - -trimpath
    env: *release_build_env
    ldflags:
      - -s -w -X github.com/openclaw/telecrawl/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
    hooks:
      post:
        - ./scripts/codesign-macos.sh "{{ .Path }}"

archives:
  - ids:
      - telecrawl
      - telecrawl_darwin
    files:
      - "none*"
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
